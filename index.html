<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>José & Angie — Nos casamos</title>
<meta name="description" content="Invitación de boda de José y Angie — 18 de octubre de 2026, Alicante">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #e7ddc4;
    overflow: hidden;
  }

  .phone-stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone-frame {
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: #fff;
  }

  .phone-frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Solo en pantallas anchas se ve el "marco de teléfono"; en un móvil real
     el iframe ya ocupa el 100% y esto no se nota. */
  @media (min-width: 561px) {
    html, body {
      overflow: auto;
    }

    .phone-stage {
      min-height: 100%;
      padding: 4vh 0;
      box-sizing: border-box;
    }

    .phone-frame {
      height: 92vh;
      min-height: 640px;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(20, 20, 10, 0.35), 0 0 0 10px #1c1c1c, 0 0 0 12px #3a3a3a;
    }
  }
</style>
</head>
<body>
  <div class="phone-stage">
    <div class="phone-frame">
      <iframe src="app.html" title="Invitación de boda — José & Angie"></iframe>
    </div>
  </div>
</body>
</html>
